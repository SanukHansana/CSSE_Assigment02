spring.application.name=dmc-backend
server.port=${PORT:8080}

# Optional private configuration file, relative to the backend working directory.
spring.config.import=optional:file:./.env[.properties],optional:file:./application-local.properties

# Spring Boot 4 uses spring.mongodb.uri. Set MONGODB_URI or the local file below.
# Include the database name (e.g. /dmc) in your connection URI.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/dmc}

# JWT_SECRET is a Base64-encoded random key of at least 32 bytes. No fallback secret.
dmc.auth.secret=${JWT_SECRET:}
dmc.auth.issuer=dmc-backend
dmc.auth.audience=dmc-api
dmc.auth.ttl-seconds=${JWT_TTL_SECONDS:900}
# Exact web origins only; native Expo clients do not use browser CORS.
dmc.auth.allowed-origins=${WEB_ALLOWED_ORIGINS:http://localhost:8081}

# Private evidence stays outside web/static resources. 5 MiB photos, 6 MiB multipart envelope.
dmc.reports.evidence-directory=${DMC_EVIDENCE_DIRECTORY:.data/hazard-evidence}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Brevo secrets are backend-only. A verified sender is required for live email.
dmc.email.brevo-key=${BREVO_API_KEY:}
dmc.email.sender=${BREVO_SENDER_EMAIL:}
dmc.email.sender-name=${BREVO_SENDER_NAME:DMC Disaster Management Centre}
